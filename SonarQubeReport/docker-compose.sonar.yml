services:
  sonarqube-db:
    image: postgres:17
    container_name: noteapp-sonarqube-db
  environment:
    POSTGRES_USER: ${SONAR_DB_USER}
    POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    POSTGRES_DB: ${SONAR_DB_NAME}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: noteapp-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
  environment:
    SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME}
    SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
    SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
